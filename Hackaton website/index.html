<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon Portal</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f3f4f6;
            --text: #1f2937;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        .hidden {
            display: none;
        }

        h2 {
            text-align: center;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .otp-row {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-otp {
            background: #10b981;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-main {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .toggle-link {
            text-align: center;
            margin-top: 15px;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">
        <div id="loginSection">
            <h2>Member Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPass" required>
                </div>
                <button type="submit" class="btn-main">Login</button>
            </form>
            <p class="toggle-link" onclick="toggleForms()">Don't have an account? Sign Up</p>
        </div>

        <div id="signupSection" class="hidden">
            <h2>Group Registration</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="tel" id="phone" required>
                    <div class="otp-row">
                        <input type="text" placeholder="Enter OTP" id="phoneOtp">
                        <button type="button" class="btn-otp" onclick="sendOtp('phone')">Send OTP</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required>
                    <div class="otp-row">
                        <input type="text" placeholder="Enter OTP" id="emailOtp">
                        <button type="button" class="btn-otp" onclick="sendOtp('email')">Send OTP</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>College Details</label>
                    <input type="text" id="college" placeholder="College Name" required style="margin-bottom:5px;">
                    <input type="text" id="university" placeholder="University Name" required
                        style="margin-bottom:5px;">
                    <input type="number" id="semester" placeholder="Current Semester" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="pass" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPass" required>
                </div>

                <button type="submit" class="btn-main">Create Account</button>
            </form>
            <p class="toggle-link" onclick="toggleForms()">Already have an account? Login</p>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE";

        function toggleForms() {
            document.getElementById('loginSection').classList.toggle('hidden');
            document.getElementById('signupSection').classList.toggle('hidden');
        }

        function sendOtp(type) {
            alert("OTP sent to your " + type + "! (This will connect to the backend soon)");
        }

        // Handle Sign Up Submission
        document.getElementById('signupForm').onsubmit = async (e) => {
            e.preventDefault();

            const pass = document.getElementById('pass').value;
            const confirm = document.getElementById('confirmPass').value;

            if (pass !== confirm) {
                alert("Passwords do not match!");
                return;
            }

            const formData = {
                action: 'signup',
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                college: document.getElementById('college').value,
                university: document.getElementById('university').value,
                semester: document.getElementById('semester').value,
                password: pass
            };

            // This will be used when backend is ready
            console.log("Data to send:", formData);
            alert("Frontend ready! Now we need to connect the Backend.");
        };
    </script>

</body>

</html>
