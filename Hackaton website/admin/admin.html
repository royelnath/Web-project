<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Owner Dashboard | Admin</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #16213e;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }

        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        #dashboard {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            color: #333;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #0f3460;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }
    </style>
</head>

<body>

    <div id="adminLogin" class="login-box">
        <h2>Owner Access</h2>
        <input type="text" id="adminId" placeholder="Admin ID">
        <input type="password" id="adminPass" placeholder="Password">
        <button onclick="fetchUserData()">Access Dashboard</button>
    </div>

    <div id="dashboard">
        <h2>Registered Participants</h2>
        <button onclick="location.reload()" style="margin-bottom: 10px;">Refresh Data</button>
        <table id="userTable">
            <thead>
                <tr id="tableHeader"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const WEB_APP_URL = "YOUR_DEPLOYED_SCRIPT_URL";

        async function fetchUserData() {
            const id = document.getElementById('adminId').value;
            const pass = document.getElementById('adminPass').value;

            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'adminFetch',
                    adminId: id,
                    adminPass: pass
                })
            });

            const data = await response.json();

            if (data.result === 'success') {
                document.getElementById('adminLogin').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                displayData(data.data);
            } else {
                alert("Invalid Owner Credentials!");
            }
        }

        function displayData(rows) {
            const header = document.getElementById('tableHeader');
            const body = document.getElementById('tableBody');

            // Create Headers
            header.innerHTML = rows[0].map(h => `<th>${h}</th>`).join('');

            // Create Rows
            body.innerHTML = rows.slice(1).map(row =>
                `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`
            ).join('');
        }
    </script>
</body>

</html>
