<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analog Clock — Neumorph</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <a class="back" href="../index.html">&larr; Back to Designs</a>

  <div class="wrap">
    <h1>Neumorph <span>Clock</span></h1>

    <div class="clock">
      <div class="face">
        <div class="tick t0"></div><div class="tick t1"></div><div class="tick t2"></div>
        <div class="tick t3"></div><div class="tick t4"></div><div class="tick t5"></div>
        <div class="tick t6"></div><div class="tick t7"></div><div class="tick t8"></div>
        <div class="tick t9"></div><div class="tick t10"></div><div class="tick t11"></div>

        <div class="hand hour" id="hour"></div>
        <div class="hand minute" id="minute"></div>
        <div class="hand second" id="second"></div>
        <div class="center-dot"></div>
      </div>
    </div>

    <div class="digital" id="digital">00:00:00</div>
  </div>

  <script src="script.js"></script>
</body>

</html>
