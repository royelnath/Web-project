<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <a class="back" href="../index.html">&larr; Back</a>

  <div class="container">
    <h1>QR Code <span>Generator</span></h1>
    <p class="hint">Turn any text or link into a scannable QR code</p>

    <input type="text" id="text" placeholder="Enter text or URL" />
    <button id="generateBtn">Generate</button>

    <div id="qrcode"></div>

    <a id="downloadBtn" class="download" href="#" download="qrcode.png" style="display:none;">Download PNG</a>
  </div>

  <script src="script.js"></script>
</body>

</html>
