<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Character Counter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Live counter</h2>
        <textarea placeholder="Start typing..." id="input" rows="10" cols="50"></textarea>
        <p>Character: <span id="count">0</span></p>
    </div>
    <script src="script.js"></script>
</body>

</html>
