<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <a class="back" href="../index.html">&larr; Back</a>

    <h1>Rock <span>Paper</span> Scissors</h1>

    <div class="choices">
        <div class="choice" id="rock"><img src="images/Rock.jpg" alt="rock"></div>
        <div class="choice" id="paper"><img src="images/Paper.jpg" alt="paper"></div>
        <div class="choice" id="scissors"><img src="images/Scissors.jpg" alt="scissors"></div>
    </div>

    <div class="scoreboard">
        <div class="myscore">
            <p id="myscore">0</p>
            <p>YOU</p>
        </div>

        <div class="versus-panel">
            <div class="pick you-pick">
                <img id="userPickImg" src="" alt="">
                <span>You</span>
            </div>
            <div class="vs">VS</div>
            <div class="pick com-pick">
                <img id="comPickImg" src="" alt="">
                <span>Comp</span>
            </div>
        </div>

        <div class="comscore">
            <p id="Comscore">0</p>
            <p>COMP</p>
        </div>
    </div>

    <div class="msgContainer">
        <p id="msg">Play the game</p>
    </div>

    <button id="resetBtn" class="reset">Reset Score</button>

    <script src="script.js"></script>
</body>

</html>
